# Malaysia statutory parameters. verified: false until checked against official
# KWSP / PERKESO / LHDN publications. Official band tables can be dropped into
# config/statutory/tables/*.csv (wage_from,wage_to,employee,employer) and then
# take precedence over the approximations computed from these rates.
verified: false
epf:
  # Rates confirmed by the user 2026-10 (KWSP Third Schedule): band ceilings RM20 up to RM5,000,
  # RM100 up to RM20,000, exact wage above RM20,000; every share rounded up to the next ringgit.
  local:
    employee_rate: 0.11
    employer_rate_low: 0.13      # wages <= employer_rate_threshold
    employer_rate_high: 0.12
    employer_rate_threshold: 5000
  local_60_plus:                 # Malaysian citizens aged 60-75 (Stage 2)
    employee_rate: 0.0
    employer_rate_low: 0.04
    employer_rate_high: 0.04
    employer_rate_threshold: 5000
  foreign:                       # non-Malaysians registered from 1 Aug 1998
    employee_rate: 0.02
    employer_rate_low: 0.02
    employer_rate_high: 0.02
    employer_rate_threshold: 5000
  table_file: config/statutory/tables/epf_local.csv
  foreign_table_file: config/statutory/tables/epf_foreign.csv
socso:
  wage_ceiling: 6000
  local:   {employee_rate: 0.005, employer_rate: 0.0175}   # Category 1: EI + invalidity
  foreign: {employee_rate: 0.0,   employer_rate: 0.0125}   # Employment Injury only
  table_file: config/statutory/tables/socso_cat1.csv
  foreign_table_file: config/statutory/tables/socso_foreign.csv
eis:
  wage_ceiling: 6000
  employee_rate: 0.002
  employer_rate: 0.002
  table_file: config/statutory/tables/eis.csv
pcb:
  # Resident chargeable income brackets (YA2023 onwards): [lower bound, rate]
  brackets:
    - [0, 0.0]
    - [5000, 0.01]
    - [20000, 0.03]
    - [35000, 0.06]
    - [50000, 0.11]
    - [70000, 0.19]
    - [100000, 0.25]
    - [400000, 0.26]
    - [600000, 0.28]
    - [2000000, 0.30]
  individual_relief: 9000
  spouse_relief: 4000
  child_relief: 2000
  epf_relief_cap: 4000
  rebate_threshold: 35000
  individual_rebate: 400
  spouse_rebate: 400
  non_resident_rate: 0.30
  minimum_deduction: 10
